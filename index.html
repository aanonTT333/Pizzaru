<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ты за или против?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        .question {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #58a6ff;
        }
        .main-image {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 18px 50px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
            min-width: 160px;
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .btn-yes {
            background: #238636;
        }
        .btn-no {
            background: #da3633;
        }
        .slide {
            display: none;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        .slide.active {
            display: flex;
        }
        .slide-text {
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        .slide-text.green {
            color: #2ea043;
        }
        .slide-text.red {
            color: #f85149;
        }
        .slide-sub {
            font-size: 20px;
            color: #8b949e;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainMenu">
        <div class="question">Ты за или против?</div>
        <img src="https://i.ibb.co/tMZKqVKQ/file-000000007e648210bc48b8510093ade2.png" alt="За и против" class="main-image">
        <div class="buttons">
            <button class="btn btn-yes" onclick="showSlide('yes')">Я ЗА</button>
            <button class="btn btn-no" onclick="showSlide('no')">Я ПРОТИВ</button>
        </div>
    </div>

    <div class="slide" id="slideYes">
        <div class="slide-text green">Отлично!</div>
        <div class="slide-sub">Тогда напиши админу.</div>
    </div>

    <div class="slide" id="slideNo">
        <div class="slide-text red">Очень жаль</div>
    </div>

    <script>
        function showSlide(answer) {
            document.getElementById('mainMenu').style.display = 'none';
            if (answer === 'yes') {
                document.getElementById('slideYes').classList.add('active');
            } else if (answer === 'no') {
                document.getElementById('slideNo').classList.add('active');
            }
        }
    </script>

</body>
</html>
